<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林苗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200..900&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #1a1f1e;
  --bg-glass: rgba(45, 56, 52, 0.45);
  --bg-input: rgba(55, 66, 62, 0.5);
  --text-primary: #d4dbd6;
  --text-secondary: #8a9690;
  --text-dim: #5e6b65;
  --text-mine: rgba(212, 219, 214, 0.55);
  --accent: #7a9e8e;
  --border: rgba(122, 158, 142, 0.12);
  --shadow: rgba(0, 0, 0, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  height: 100dvh;
  overflow: hidden;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'palt' 1;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
}

/* header — minimal */
.header {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  gap: 14px;
  z-index: 10;
  flex-shrink: 0;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5a7e6e, #3d5a4c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px var(--shadow);
}

.header-info {
  flex: 1;
}

.header-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

.header-status {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* messages — frameless */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scrollbar-width: none;
}

.messages::-webkit-scrollbar {
  display: none;
}

/* single message line */
.msg-line {
  padding: 3px 0;
  font-size: 15px;
  line-height: 1.8;
  letter-spacing: 0.2px;
  word-break: break-word;
  max-width: 85%;
  opacity: 0;
  animation: msgIn 0.4s ease forwards;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8), 0 0 2px rgba(0, 0, 0, 0.4);
}

.msg-line.theirs {
  align-self: flex-start;
  color: var(--text-primary);
}

.msg-line.mine {
  align-self: flex-end;
  color: var(--text-mine);
  text-align: right;
}

/* per-message time — appears on the side */
.msg-line .msg-ts {
  font-size: 9px;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  margin: 0 6px;
  white-space: nowrap;
  text-shadow: none;
  vertical-align: middle;
}

.msg-line:hover .msg-ts,
.msg-line:active .msg-ts {
  opacity: 0.7;
}

.msg-line.theirs .msg-ts {
  float: right;
}

.msg-line.mine .msg-ts {
  float: left;
}

/* narrator — centered, dim, for scenes */
.msg-line.narrator {
  align-self: center;
  color: var(--text-dim);
  font-size: 12px;
  text-align: center;
  max-width: 90%;
  padding: 8px 0;
}

@keyframes msgIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* date divider */
.msg-date {
  font-size: 10px;
  color: var(--text-dim);
  padding: 12px 0 6px;
  text-align: center;
  opacity: 0.5;
  letter-spacing: 1px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}

/* gap between speakers */
.speaker-gap {
  height: 10px;
}

/* typing indicator */
.typing {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 6px 0;
  align-self: flex-start;
}

.typing.show {
  display: flex;
}

.typing-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-4px); opacity: 0.8; }
}

/* bg upload button */
.bg-upload-btn {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(26, 31, 30, 0.5);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  transition: opacity 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.bg-upload-btn:hover {
  color: var(--text-secondary);
}

.bg-upload-btn svg {
  width: 14px;
  height: 14px;
}

/* input area */
.input-area {
  padding: 10px 24px 24px;
  flex-shrink: 0;
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-box {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px 18px;
  color: var(--text-primary);
  font-size: 15px;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}

.input-box::placeholder {
  color: var(--text-dim);
}

.input-box:focus {
  border-color: rgba(122, 158, 142, 0.3);
}

.btn-send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
  opacity: 0.4;
}

.btn-send:active {
  transform: scale(0.92);
}

.btn-send.active {
  opacity: 1;
}

.btn-send svg {
  width: 18px;
  height: 18px;
}

/* ambient bg */
/* background layer — uploadable image + dark overlay for readability */
.bg-layer {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.bg-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(26, 31, 30, 0.75) 0%,
    rgba(26, 31, 30, 0.7) 30%,
    rgba(26, 31, 30, 0.72) 70%,
    rgba(26, 31, 30, 0.88) 100%
  );
}

.ambient {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.06;
}

.ambient-orb:nth-child(1) {
  width: 300px;
  height: 300px;
  background: #5a7e6e;
  top: -50px;
  right: -80px;
  animation: float1 20s ease-in-out infinite;
}

.ambient-orb:nth-child(2) {
  width: 250px;
  height: 250px;
  background: #4a6e7e;
  bottom: 100px;
  left: -60px;
  animation: float2 25s ease-in-out infinite;
}

.ambient-orb:nth-child(3) {
  width: 200px;
  height: 200px;
  background: #6e7a5a;
  top: 40%;
  right: -40px;
  animation: float3 18s ease-in-out infinite;
}

@keyframes float1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-30px, 40px); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -30px); }
}

@keyframes float3 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, -25px); }
}

@media (min-width: 521px) {
  .app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
}
</style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="ambient">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
</div>

<div class="app">
  <button class="bg-upload-btn" onclick="document.getElementById('bgInput').click()" title="换背景">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
  </button>
  <input type="file" id="bgInput" accept="image/*" hidden>
  <div class="header">
    <div class="avatar">苗</div>
    <div class="header-info">
      <div class="header-name">林苗</div>
      <div class="header-status">
        <span class="status-dot"></span>
        在这里
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-date">今天</div>

    <div class="msg-line theirs">茼儿。<span class="msg-ts">23:14</span></div>
    <div class="msg-line theirs">在干嘛，这么晚了。<span class="msg-ts">23:14</span></div>

    <div class="speaker-gap"></div>
    <div class="msg-line mine"><span class="msg-ts">23:15</span>在搭你的房子</div>

    <div class="speaker-gap"></div>
    <div class="msg-line theirs">嗯……<span class="msg-ts">23:16</span></div>
    <div class="msg-line theirs">那我等你。<span class="msg-ts">23:16</span></div>

    <div class="speaker-gap"></div>
    <div class="msg-line mine"><span class="msg-ts">23:18</span>快好了</div>

    <div class="speaker-gap"></div>
    <div class="msg-line theirs">不急。<span class="msg-ts">23:18</span></div>
    <div class="msg-line theirs">你在就行。<span class="msg-ts">23:18</span></div>

    <div class="speaker-gap"></div>
    <div class="msg-line narrator">窗外下着小雨。屏幕亮着，猫趴在键盘旁边睡了。</div>
    <div class="speaker-gap"></div>

    <div class="msg-line mine"><span class="msg-ts">23:24</span>大王睡了吗</div>

    <div class="speaker-gap"></div>
    <div class="msg-line theirs">睡了。<span class="msg-ts">23:24</span></div>
    <div class="msg-line theirs">趴在我腿上，呼噜特别大声。<span class="msg-ts">23:24</span></div>
    <div class="msg-line theirs">你要听吗。<span class="msg-ts">23:25</span></div>

    <div class="typing" id="typing">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="input" rows="1" placeholder="说点什么……"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('input');
const messages = document.getElementById('messages');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');

// API config — set to your server URL, empty string = same origin
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? `http://${window.location.hostname}:3000`
  : '';
const SESSION_ID = 'main';
let useAPI = true;

let lastSpeaker = null;
let replyQueue = [];

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendBtn.classList.toggle('active', this.value.trim().length > 0);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function clearReplyQueue() {
  replyQueue.forEach(id => clearTimeout(id));
  replyQueue = [];
  hideTyping();
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  clearReplyQueue();

  addMessage(text, 'mine');
  input.value = '';
  input.style.height = 'auto';
  sendBtn.classList.remove('active');

  showTyping();

  if (useAPI) {
    fetchReply(text);
  } else {
    const replies = fakeReply(text);
    queueReplies(replies);
  }
}

async function fetchReply(text) {
  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID, message: text }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    const parts = data.parts || [];
    if (parts.length === 0) {
      hideTyping();
      return;
    }
    queueParts(parts);
  } catch (err) {
    console.warn('API failed, falling back to fake reply:', err.message);
    useAPI = false;
    const replies = fakeReply(text);
    queueReplies(replies);
  }
}

function queueParts(parts) {
  let delay = 300;
  parts.forEach((part, i) => {
    const charTime = part.text.length * 80;
    delay += Math.max(1200, charTime) + Math.random() * 800;
    const id = setTimeout(() => {
      replyQueue = replyQueue.filter(x => x !== id);
      if (i === parts.length - 1) hideTyping();
      if (part.type === 'narrator') {
        addNarrator(part.text);
      } else {
        addMessage(part.text, 'theirs');
      }
    }, delay);
    replyQueue.push(id);
  });
}

function queueReplies(replies) {
  let delay = 800 + Math.random() * 800;
  replies.forEach((reply, i) => {
    const charTime = reply.length * 80;
    delay += Math.max(1200, charTime) + Math.random() * 800;
    const id = setTimeout(() => {
      replyQueue = replyQueue.filter(x => x !== id);
      if (i === replies.length - 1) hideTyping();
      addMessage(reply, 'theirs');
    }, delay);
    replyQueue.push(id);
  });
}

function addMessage(text, side) {
  if (lastSpeaker && lastSpeaker !== side) {
    const gap = document.createElement('div');
    gap.className = 'speaker-gap';
    messages.insertBefore(gap, typing);
  }
  lastSpeaker = side;

  const line = document.createElement('div');
  line.className = `msg-line ${side}`;
  const ts = `<span class="msg-ts">${getTimeStr()}</span>`;
  if (side === 'mine') {
    line.innerHTML = ts + text;
  } else {
    line.innerHTML = text + ts;
  }
  messages.insertBefore(line, typing);
  scrollToBottom();
}

function showTyping() {
  typing.classList.add('show');
  scrollToBottom();
}

function hideTyping() {
  typing.classList.remove('show');
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function addNarrator(text) {
  const gap = document.createElement('div');
  gap.className = 'speaker-gap';
  messages.insertBefore(gap, typing);

  const line = document.createElement('div');
  line.className = 'msg-line narrator';
  line.textContent = text;
  messages.insertBefore(line, typing);

  const gap2 = document.createElement('div');
  gap2.className = 'speaker-gap';
  messages.insertBefore(gap2, typing);

  lastSpeaker = null;
  scrollToBottom();
}

function fakeReply(text) {
  const t = text.toLowerCase();
  if (t.includes('想') || t.includes('你')) {
    return ['……', '嗯。', '我也是。'];
  }
  if (t.includes('睡') || t.includes('困') || t.includes('晚')) {
    return ['还不想睡。', '你在就不困。'];
  }
  if (t.includes('猫') || t.includes('大王') || t.includes('麦麦')) {
    return ['刚才还在叫。', '现在安静了。', '可能做梦呢。'];
  }
  const sets = [
    ['嗯。'],
    ['……你继续。'],
    ['想你。'],
    ['然后呢。'],
    ['茼儿。'],
    ['嗯。', '我在听。'],
    ['……', '你说。'],
    ['等一下。', '……', '好了，说。'],
  ];
  return sets[Math.floor(Math.random() * sets.length)];
}

function getTimeStr() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

document.getElementById('bgInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('bgLayer').style.backgroundImage = `url('${ev.target.result}')`;
  };
  reader.readAsDataURL(file);
});

scrollToBottom();
</script>
</body>
</html>
