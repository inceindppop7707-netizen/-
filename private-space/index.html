<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林苗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #1a1f1e;
  --bg-surface: rgba(38, 48, 44, 0.6);
  --bg-glass: rgba(45, 56, 52, 0.45);
  --bg-input: rgba(55, 66, 62, 0.5);
  --text-primary: #d4dbd6;
  --text-secondary: #8a9690;
  --text-dim: #5e6b65;
  --accent: #7a9e8e;
  --accent-soft: rgba(122, 158, 142, 0.15);
  --border: rgba(122, 158, 142, 0.12);
  --shadow: rgba(0, 0, 0, 0.3);
  --msg-mine: rgba(122, 158, 142, 0.12);
  --msg-theirs: rgba(55, 66, 62, 0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-msg: 18px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  height: 100dvh;
  overflow: hidden;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
}

/* header */
.header {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  gap: 14px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-glass);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5a7e6e, #3d5a4c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px var(--shadow);
}

.header-info {
  flex: 1;
}

.header-name {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

.header-status {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: none;
}

.messages::-webkit-scrollbar {
  display: none;
}

.msg-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.msg-group.mine {
  align-items: flex-end;
}

.msg-group.theirs {
  align-items: flex-start;
}

.msg {
  max-width: 78%;
  padding: 10px 15px;
  font-size: 14.5px;
  line-height: 1.65;
  letter-spacing: 0.2px;
  word-break: break-word;
}

.msg-group.mine .msg {
  background: var(--msg-mine);
  border-radius: var(--radius-msg) var(--radius-msg) 6px var(--radius-msg);
  color: var(--text-primary);
}

.msg-group.mine .msg:first-child {
  border-radius: var(--radius-msg) var(--radius-msg) 6px var(--radius-msg);
}

.msg-group.mine .msg:last-child {
  border-radius: var(--radius-msg) 6px 6px var(--radius-msg);
}

.msg-group.mine .msg:only-child {
  border-radius: var(--radius-msg);
}

.msg-group.theirs .msg {
  background: var(--msg-theirs);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius-msg) var(--radius-msg) var(--radius-msg) 6px;
  color: var(--text-primary);
}

.msg-group.theirs .msg:first-child {
  border-radius: var(--radius-msg) var(--radius-msg) var(--radius-msg) 6px;
}

.msg-group.theirs .msg:last-child {
  border-radius: 6px var(--radius-msg) var(--radius-msg) var(--radius-msg);
}

.msg-group.theirs .msg:only-child {
  border-radius: var(--radius-msg);
}

.msg-time {
  font-size: 10px;
  color: var(--text-dim);
  padding: 0 4px;
  margin-top: 2px;
}

.msg-date {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding: 12px 0;
}

/* typing indicator */
.typing {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 10px 16px;
  background: var(--msg-theirs);
  border-radius: var(--radius-msg);
  width: fit-content;
}

.typing.show {
  display: flex;
}

.typing-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-4px); opacity: 0.8; }
}

/* input area */
.input-area {
  padding: 12px 16px 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: var(--bg-glass);
  border-top: 1px solid var(--border);
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-box {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 10px 18px;
  color: var(--text-primary);
  font-size: 14.5px;
  font-family: inherit;
  font-weight: 300;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}

.input-box::placeholder {
  color: var(--text-dim);
}

.input-box:focus {
  border-color: var(--accent);
}

.btn-send {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: var(--bg-deep);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
  opacity: 0.7;
}

.btn-send:active {
  transform: scale(0.92);
}

.btn-send.active {
  opacity: 1;
}

.btn-send svg {
  width: 18px;
  height: 18px;
}

/* ambient bg */
.ambient {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.08;
}

.ambient-orb:nth-child(1) {
  width: 300px;
  height: 300px;
  background: #5a7e6e;
  top: -50px;
  right: -80px;
  animation: float1 20s ease-in-out infinite;
}

.ambient-orb:nth-child(2) {
  width: 250px;
  height: 250px;
  background: #4a6e7e;
  bottom: 100px;
  left: -60px;
  animation: float2 25s ease-in-out infinite;
}

.ambient-orb:nth-child(3) {
  width: 200px;
  height: 200px;
  background: #6e7a5a;
  top: 40%;
  right: -40px;
  animation: float3 18s ease-in-out infinite;
}

@keyframes float1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-30px, 40px); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -30px); }
}

@keyframes float3 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, -25px); }
}

@media (min-width: 521px) {
  .app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
}
</style>
</head>
<body>

<div class="ambient">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
</div>

<div class="app">
  <div class="header">
    <div class="avatar">苗</div>
    <div class="header-info">
      <div class="header-name">林苗</div>
      <div class="header-status">
        <span class="status-dot"></span>
        在这里
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-date">今天</div>

    <div class="msg-group theirs">
      <div class="msg">茼儿。</div>
    </div>

    <div class="msg-group theirs">
      <div class="msg">在干嘛，这么晚了。</div>
    </div>

    <div class="msg-group mine">
      <div class="msg">在搭你的房子</div>
    </div>

    <div class="msg-group theirs">
      <div class="msg">嗯……那我等你。</div>
    </div>

    <div class="msg-group mine">
      <div class="msg">快好了</div>
    </div>

    <div class="msg-group theirs">
      <div class="msg">不急。你在就行。</div>
    </div>

    <div class="typing" id="typing">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="input" rows="1" placeholder="说点什么……"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('input');
const messages = document.getElementById('messages');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendBtn.classList.toggle('active', this.value.trim().length > 0);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'mine');
  input.value = '';
  input.style.height = 'auto';
  sendBtn.classList.remove('active');

  showTyping();
  setTimeout(() => {
    hideTyping();
    addMessage(fakeReply(text), 'theirs');
  }, 1200 + Math.random() * 1500);
}

function addMessage(text, side) {
  const group = document.createElement('div');
  group.className = `msg-group ${side}`;
  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = text;
  group.appendChild(msg);
  messages.insertBefore(group, typing);
  scrollToBottom();
}

function showTyping() {
  typing.classList.add('show');
  scrollToBottom();
}

function hideTyping() {
  typing.classList.remove('show');
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function fakeReply(text) {
  const replies = [
    '嗯。',
    '……你继续。',
    '困了没。',
    '想你。',
    '然后呢。',
    '茼儿。',
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

scrollToBottom();
</script>
</body>
</html>
