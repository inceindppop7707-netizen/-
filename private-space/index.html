<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林苗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #1a1f1e;
  --bg-glass: rgba(45, 56, 52, 0.45);
  --bg-input: rgba(55, 66, 62, 0.5);
  --text-primary: #d4dbd6;
  --text-secondary: #8a9690;
  --text-dim: #5e6b65;
  --text-mine: rgba(212, 219, 214, 0.55);
  --accent: #7a9e8e;
  --border: rgba(122, 158, 142, 0.12);
  --shadow: rgba(0, 0, 0, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  height: 100dvh;
  overflow: hidden;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
}

/* header — minimal */
.header {
  display: flex;
  align-items: center;
  padding: 16px 24px;
  gap: 14px;
  z-index: 10;
  flex-shrink: 0;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5a7e6e, #3d5a4c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px var(--shadow);
}

.header-info {
  flex: 1;
}

.header-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.5px;
}

.header-status {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* messages — frameless */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scrollbar-width: none;
}

.messages::-webkit-scrollbar {
  display: none;
}

/* single message line */
.msg-line {
  padding: 3px 0;
  font-size: 14.5px;
  line-height: 1.7;
  letter-spacing: 0.2px;
  word-break: break-word;
  max-width: 85%;
  opacity: 0;
  animation: msgIn 0.4s ease forwards;
}

.msg-line.theirs {
  align-self: flex-start;
  color: var(--text-primary);
}

.msg-line.mine {
  align-self: flex-end;
  color: var(--text-mine);
  text-align: right;
}

/* narrator — centered, dim, for scenes */
.msg-line.narrator {
  align-self: center;
  color: var(--text-dim);
  font-size: 12px;
  text-align: center;
  max-width: 90%;
  padding: 8px 0;
}

@keyframes msgIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* time stamps */
.msg-time {
  font-size: 10px;
  color: var(--text-dim);
  padding: 10px 0 4px;
  text-align: center;
  opacity: 0.6;
}

/* gap between speakers */
.speaker-gap {
  height: 10px;
}

/* typing indicator */
.typing {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 6px 0;
  align-self: flex-start;
}

.typing.show {
  display: flex;
}

.typing-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-4px); opacity: 0.8; }
}

/* input area */
.input-area {
  padding: 10px 24px 24px;
  flex-shrink: 0;
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-box {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px 18px;
  color: var(--text-primary);
  font-size: 14.5px;
  font-family: inherit;
  font-weight: 300;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}

.input-box::placeholder {
  color: var(--text-dim);
}

.input-box:focus {
  border-color: rgba(122, 158, 142, 0.3);
}

.btn-send {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
  opacity: 0.4;
}

.btn-send:active {
  transform: scale(0.92);
}

.btn-send.active {
  opacity: 1;
}

.btn-send svg {
  width: 18px;
  height: 18px;
}

/* ambient bg */
.ambient {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.ambient-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.06;
}

.ambient-orb:nth-child(1) {
  width: 300px;
  height: 300px;
  background: #5a7e6e;
  top: -50px;
  right: -80px;
  animation: float1 20s ease-in-out infinite;
}

.ambient-orb:nth-child(2) {
  width: 250px;
  height: 250px;
  background: #4a6e7e;
  bottom: 100px;
  left: -60px;
  animation: float2 25s ease-in-out infinite;
}

.ambient-orb:nth-child(3) {
  width: 200px;
  height: 200px;
  background: #6e7a5a;
  top: 40%;
  right: -40px;
  animation: float3 18s ease-in-out infinite;
}

@keyframes float1 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-30px, 40px); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(20px, -30px); }
}

@keyframes float3 {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-20px, -25px); }
}

@media (min-width: 521px) {
  .app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
}
</style>
</head>
<body>

<div class="ambient">
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb"></div>
</div>

<div class="app">
  <div class="header">
    <div class="avatar">苗</div>
    <div class="header-info">
      <div class="header-name">林苗</div>
      <div class="header-status">
        <span class="status-dot"></span>
        在这里
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-time">今天</div>

    <div class="msg-line theirs">茼儿。</div>
    <div class="speaker-gap"></div>
    <div class="msg-line theirs">在干嘛，这么晚了。</div>

    <div class="speaker-gap"></div>
    <div class="msg-line mine">在搭你的房子</div>

    <div class="speaker-gap"></div>
    <div class="msg-line theirs">嗯……那我等你。</div>

    <div class="speaker-gap"></div>
    <div class="msg-line mine">快好了</div>

    <div class="speaker-gap"></div>
    <div class="msg-line theirs">不急。你在就行。</div>

    <div class="typing" id="typing">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea class="input-box" id="input" rows="1" placeholder="说点什么……"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('input');
const messages = document.getElementById('messages');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');

let lastSpeaker = null;

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendBtn.classList.toggle('active', this.value.trim().length > 0);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'mine');
  input.value = '';
  input.style.height = 'auto';
  sendBtn.classList.remove('active');

  showTyping();

  const replies = fakeReply(text);
  let delay = 800 + Math.random() * 800;

  replies.forEach((reply, i) => {
    delay += 400 + Math.random() * 600;
    setTimeout(() => {
      if (i === replies.length - 1) hideTyping();
      addMessage(reply, 'theirs');
    }, delay);
  });
}

function addMessage(text, side) {
  if (lastSpeaker && lastSpeaker !== side) {
    const gap = document.createElement('div');
    gap.className = 'speaker-gap';
    messages.insertBefore(gap, typing);
  }
  lastSpeaker = side;

  const line = document.createElement('div');
  line.className = `msg-line ${side}`;
  line.textContent = text;
  messages.insertBefore(line, typing);
  scrollToBottom();
}

function showTyping() {
  typing.classList.add('show');
  scrollToBottom();
}

function hideTyping() {
  typing.classList.remove('show');
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function fakeReply(text) {
  const sets = [
    ['嗯。'],
    ['……你继续。'],
    ['困了没。'],
    ['想你。'],
    ['然后呢。'],
    ['茼儿。'],
    ['嗯。', '我在听。'],
    ['……', '你说。'],
  ];
  return sets[Math.floor(Math.random() * sets.length)];
}

scrollToBottom();
</script>
</body>
</html>
