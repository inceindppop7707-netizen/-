<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>林苗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1d21;--surface:#22262b;--surface2:#2a2f35;--glass:rgba(34,38,43,.72);
  --text:#e8e6e3;--text2:#9a9590;--text3:#5e5955;
  --accent:#c4956a;--accent2:#a07850;--danger:#c25f5f;--success:#6a9a6e;
  --font-size:15px;--line-height:1.65;--bubble-gap:10px;--show-time:1;
  --radius:14px;--radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-size:var(--font-size);line-height:var(--line-height)}
body{position:relative}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit;background:var(--surface2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);padding:8px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.08;pointer-events:none;z-index:0;animation:orbFloat 20s ease-in-out infinite alternate}
.orb-1{width:300px;height:300px;background:var(--accent);top:-80px;right:-60px;animation-delay:-5s}
.orb-2{width:250px;height:250px;background:#6a7a9a;bottom:-60px;left:-80px;animation-delay:-12s}
.orb-3{width:180px;height:180px;background:#8a6a9a;top:40%;left:30%;animation-delay:-8s}
@keyframes orbFloat{0%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}100%{transform:translate(-20px,20px)}}

/* ── Splash ── */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .8s ease,visibility .8s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
#splash .greeting{position:relative;z-index:1;font-family:'Noto Serif SC',serif;font-size:clamp(18px,5vw,28px);color:var(--text);opacity:0;
  animation:fadeUp .8s .3s ease forwards}
#splash .sub{position:relative;z-index:1;font-size:13px;color:var(--text2);margin-top:12px;opacity:0;animation:fadeUp .8s .6s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── App Shell ── */
#app{display:flex;flex-direction:column;height:100%;position:relative;z-index:1}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.active{display:flex}

/* ── Header ── */
.header{display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:calc(8px + var(--safe-top));
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04);
  position:relative;z-index:10;flex-shrink:0}
.header .menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
.header .menu-btn:hover{background:rgba(255,255,255,.06)}
.header .menu-btn svg{width:20px;height:20px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round}
.header .title{flex:1;font-family:'Noto Serif SC',serif;font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .search-btn,.header .nav-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
.header .search-btn:hover,.header .nav-btn:hover{background:rgba(255,255,255,.06)}
.header .search-btn svg,.header .nav-btn svg{width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round}

/* ── Nav pills ── */
.nav-pills{display:flex;gap:6px;padding:6px 16px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.nav-pill{padding:6px 16px;border-radius:20px;font-size:13px;color:var(--text2);transition:all .2s}
.nav-pill.active{background:rgba(255,255,255,.08);color:var(--text)}

/* ── Search Bar ── */
.search-bar{display:none;padding:8px 16px;background:var(--surface);border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.search-bar.open{display:flex;gap:8px;align-items:center}
.search-bar input{flex:1;background:var(--surface2);border-radius:20px;padding:6px 14px;font-size:13px}
.search-bar .close-search{color:var(--text2);font-size:13px}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px;padding-left:max(16px,var(--safe-left));
  padding-right:max(16px,var(--safe-right));display:flex;flex-direction:column;gap:var(--bubble-gap);
  scroll-behavior:smooth;overscroll-behavior:contain}
.messages .load-more{text-align:center;padding:12px}
.messages .load-more button{font-size:12px;color:var(--text3);padding:6px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.messages .load-more button:hover{border-color:var(--accent);color:var(--text2)}

.date-sep{text-align:center;font-size:11px;color:var(--text3);padding:8px 0;position:relative}
.date-sep::before{content:'';position:absolute;left:20%;right:20%;top:50%;border-top:1px solid rgba(255,255,255,.04)}
.date-sep span{position:relative;background:var(--bg);padding:0 12px}

.msg-row{display:flex;gap:8px;max-width:85%;animation:msgIn .25s ease}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-row.followup{margin-top:calc(var(--bubble-gap) * -0.6)}
.msg-row .avatar{width:28px;height:28px;border-radius:50%;background:var(--surface2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3)}
.msg-row .avatar img{width:100%;height:100%;object-fit:cover}
.msg-row.followup .avatar{visibility:hidden}

.bubble{padding:10px 14px;border-radius:var(--radius);max-width:100%;word-break:break-word;position:relative}
.msg-row:not(.out) .bubble{background:var(--surface);border-top-left-radius:4px}
.msg-row.out .bubble{background:rgba(196,149,106,.15);border-top-right-radius:4px}
.bubble .time{font-size:10px;color:var(--text3);margin-top:4px;opacity:var(--show-time);transition:opacity .2s}
.bubble .status{font-size:10px;display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.bubble .status.sending{color:var(--text3)}
.bubble .status.failed{color:var(--danger);cursor:pointer}
.bubble .status.failed:hover{text-decoration:underline}

.msg-narrator{text-align:center;font-style:italic;color:var(--text2);font-size:13px;padding:4px 20px;max-width:80%;align-self:center}
.msg-sticker{max-width:160px;border-radius:var(--radius-sm);cursor:pointer}
.msg-sticker img{width:100%;border-radius:var(--radius-sm)}

.thinking-block{margin-top:6px;border-left:2px solid var(--accent2);padding:4px 10px;font-size:12px;color:var(--text3)}
.thinking-toggle{font-size:11px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:4px}
.thinking-toggle:hover{color:var(--text2)}
.thinking-content{margin-top:4px;white-space:pre-wrap;display:none}
.thinking-content.open{display:block}

@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Input Area ── */
.input-area{padding:8px 16px;padding-bottom:calc(8px + var(--safe-bottom));padding-left:max(16px,var(--safe-left));
  padding-right:max(16px,var(--safe-right));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.04);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;resize:none;background:var(--surface2);border-radius:20px;padding:10px 16px;font-size:14px;
  max-height:120px;min-height:40px;line-height:1.4;overflow-y:auto;border:1px solid transparent;transition:border-color .2s}
.input-row textarea:focus{border-color:rgba(196,149,106,.3)}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;opacity:.5}
.send-btn.ready{opacity:1}
.send-btn:disabled{opacity:.3;cursor:default}
.send-btn svg{width:18px;height:18px;stroke:#1a1d21;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.char-count{font-size:10px;color:var(--text3);text-align:right;margin-top:2px;min-height:14px}

/* ── Sidebar ── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;visibility:hidden;transition:all .3s}
.sidebar-overlay.open{opacity:1;visibility:visible}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:80vw;background:var(--surface);z-index:101;
  transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);padding-left:var(--safe-left)}
.sidebar.open{transform:translateX(0)}
.sidebar h2{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:400;padding:20px 16px 12px;color:var(--text)}
.sidebar .new-session{margin:0 12px 12px;padding:10px;border-radius:var(--radius-sm);border:1px dashed rgba(255,255,255,.1);
  color:var(--text2);font-size:13px;text-align:center;transition:all .2s}
.sidebar .new-session:hover{border-color:var(--accent);color:var(--accent)}
.session-list{flex:1;overflow-y:auto;padding:0 8px}
.session-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;position:relative}
.session-item:hover{background:rgba(255,255,255,.04)}
.session-item.active{background:rgba(196,149,106,.1)}
.session-item .s-name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .s-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.session-item:hover .s-actions{opacity:1}
.session-item .s-actions button{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;color:var(--text3)}
.session-item .s-actions button:hover{background:rgba(255,255,255,.06);color:var(--text2)}

/* ── Settings ── */
.settings-view{flex:1;overflow-y:auto;padding:20px 16px;padding-left:max(16px,var(--safe-left));
  padding-right:max(16px,var(--safe-right))}
.settings-view h3{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:400;color:var(--text2);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.04)}
.settings-view h3:first-child{margin-top:0}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:12px}
.setting-row label{font-size:13px;color:var(--text2);flex-shrink:0}
.setting-row input[type=range]{flex:1;max-width:160px;accent-color:var(--accent)}
.setting-row .val{font-size:12px;color:var(--text3);min-width:36px;text-align:right}
.toggle{position:relative;width:40px;height:22px;background:var(--surface2);border-radius:11px;cursor:pointer;transition:background .2s;border:none;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;transition:all .2s}
.btn-outline{border:1px solid rgba(255,255,255,.1);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-fill{background:var(--accent);color:#1a1d21}
.btn-danger{border:1px solid var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:var(--text)}
.setting-row input[type=text],
.setting-row input[type=password]{flex:1;max-width:200px;font-size:13px;padding:6px 10px}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;padding:8px 0}
.sticker-grid .sticker-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;position:relative;cursor:pointer;background:var(--surface2)}
.sticker-grid .sticker-item img{width:100%;height:100%;object-fit:cover}
.sticker-grid .sticker-item .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);
  color:var(--danger);font-size:11px;display:none;align-items:center;justify-content:center;line-height:1}
.sticker-grid .sticker-item:hover .del{display:flex}

/* ── Space ── */
.space-view{flex:1;overflow-y:auto;padding:16px;padding-left:max(16px,var(--safe-left));padding-right:max(16px,var(--safe-right))}
.post-composer{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.post-composer textarea{width:100%;background:transparent;border:none;resize:none;min-height:60px;font-size:14px}
.post-composer .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.post-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.post-card .post-text{font-size:14px;margin-bottom:8px;white-space:pre-wrap}
.post-card .post-img{max-width:100%;border-radius:var(--radius-sm);margin-bottom:8px}
.post-card .post-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text3)}
.post-card .post-meta button{color:var(--text3);font-size:11px;display:flex;align-items:center;gap:4px;transition:color .2s}
.post-card .post-meta button:hover{color:var(--accent)}
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.post-comments .comment{font-size:12px;color:var(--text2);padding:4px 0}
.post-comments .comment b{color:var(--text);font-weight:500}
.comment-input{display:flex;gap:6px;margin-top:8px}
.comment-input input{flex:1;font-size:12px;padding:5px 10px;border-radius:16px}
.comment-input button{font-size:12px;color:var(--accent)}

/* ── Toast ── */
.toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--surface2);color:var(--text);padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;
  transition:all .3s;z-index:200;pointer-events:none;border:1px solid rgba(255,255,255,.06)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .msg-row{max-width:90%}
  .sidebar{width:260px}
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Splash -->
<div id="splash">
  <canvas id="rainCanvas"></canvas>
  <div class="greeting" id="greetText"></div>
  <div class="sub">floatmiao.top</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <h2>对话</h2>
  <button class="new-session" id="newSessionBtn">+ 新对话</button>
  <div class="session-list" id="sessionList"></div>
</div>

<!-- App -->
<div id="app">
  <div class="header">
    <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg></button>
    <div class="title" id="headerTitle">林苗</div>
    <button class="search-btn" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button>
    <button class="nav-btn" id="navToggle"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="var(--text2)" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="var(--text2)" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="var(--text2)" stroke="none"/></svg></button>
  </div>

  <div class="nav-pills" id="navPills" hidden>
    <button class="nav-pill active" data-view="chat">聊天</button>
    <button class="nav-pill" data-view="space">树洞</button>
    <button class="nav-pill" data-view="settings">设置</button>
  </div>

  <div class="search-bar" id="searchBar">
    <input type="text" placeholder="搜索消息…" id="searchInput">
    <button class="close-search" id="closeSearch">取消</button>
  </div>

  <!-- Chat View -->
  <div class="view active" id="chatView">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="msgInput" rows="1" placeholder="说点什么…"></textarea>
        <button class="send-btn" id="sendBtn" disabled><svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
      <div class="char-count" id="charCount"></div>
    </div>
  </div>

  <!-- Space View -->
  <div class="view" id="spaceView">
    <div class="space-view">
      <div class="post-composer">
        <textarea id="postInput" placeholder="写点什么…"></textarea>
        <div class="actions">
          <button class="btn btn-fill" id="postBtn">发布</button>
        </div>
      </div>
      <div id="postsList"></div>
    </div>
  </div>

  <!-- Settings View -->
  <div class="view" id="settingsView">
    <div class="settings-view">
      <h3>管理员</h3>
      <div class="setting-row">
        <label>密码</label>
        <input type="password" id="adminPass" placeholder="管理员密码">
      </div>
      <div class="setting-row">
        <label></label>
        <button class="btn btn-outline" id="savePassBtn">保存</button>
      </div>

      <h3>模型配置</h3>
      <div class="setting-row"><label>模型</label><select id="cfgModel"><option value="">加载中…</option></select></div>
      <div class="setting-row"><label>API Key</label><input type="password" id="cfgKey" placeholder="sk-..."></div>
      <div class="setting-row"><label>Base URL</label><input type="text" id="cfgUrl" placeholder="https://..."></div>
      <div class="setting-row"><label></label><button class="btn btn-fill" id="saveCfgBtn">保存配置</button></div>

      <h3>聊天偏好</h3>
      <div class="setting-row">
        <label>字号</label>
        <input type="range" min="12" max="20" step="1" id="prefFontSize">
        <span class="val" id="prefFontSizeVal"></span>
      </div>
      <div class="setting-row">
        <label>行高</label>
        <input type="range" min="1.3" max="2" step="0.05" id="prefLineHeight">
        <span class="val" id="prefLineHeightVal"></span>
      </div>
      <div class="setting-row">
        <label>气泡间距</label>
        <input type="range" min="4" max="20" step="2" id="prefGap">
        <span class="val" id="prefGapVal"></span>
      </div>
      <div class="setting-row">
        <label>显示时间</label>
        <button class="toggle" id="prefShowTime"></button>
      </div>
      <div class="setting-row">
        <label>Enter发送</label>
        <button class="toggle" id="prefEnterSend"></button>
      </div>

      <h3>表情贴纸</h3>
      <div class="sticker-grid" id="stickerGrid"></div>
      <div class="setting-row" style="flex-wrap:wrap;gap:8px">
        <input type="text" id="stickerName" placeholder="名称" style="max-width:100px">
        <input type="text" id="stickerUrl" placeholder="图片URL" style="flex:1;max-width:none">
        <button class="btn btn-outline" id="addStickerBtn">添加</button>
      </div>

      <h3>数据</h3>
      <div class="setting-row">
        <button class="btn btn-outline" id="exportBtn">导出所有数据</button>
        <label class="btn btn-outline" style="cursor:pointer">
          导入数据
          <input type="file" accept=".json" id="importFile" hidden>
        </label>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// ── Helpers ──
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

// ── Preferences ──
const PREF_DEFAULTS={fontSize:15,lineHeight:1.65,bubbleGap:10,showTime:true,enterSend:true};
let prefs={...PREF_DEFAULTS};
function loadPrefs(){try{const s=localStorage.getItem('lm_prefs');if(s)prefs={...PREF_DEFAULTS,...JSON.parse(s)}}catch{}}
function savePrefs(){try{localStorage.setItem('lm_prefs',JSON.stringify(prefs))}catch{}}
function applyPrefs(){
  const r=document.documentElement.style;
  r.setProperty('--font-size',prefs.fontSize+'px');
  r.setProperty('--line-height',String(prefs.lineHeight));
  r.setProperty('--bubble-gap',prefs.bubbleGap+'px');
  r.setProperty('--show-time',prefs.showTime?'1':'0');
}

// ── State ──
let adminPass='';try{adminPass=localStorage.getItem('lm_admin')||''}catch{}
let currentSession=null;try{currentSession=localStorage.getItem('lm_session')||null}catch{}
let sessions=[];
let messages=[];
let stickers=[];
let sending=false;
let allLoaded=false;
let searchQuery='';

// ── API ──
function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(adminPass)headers['x-admin-pass']=adminPass;
  return fetch(path,{...opts,headers}).then(r=>r.json());
}

// ── Splash ──
function initSplash(){
  const h=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})).getHours();
  let g='';
  if(h>=0&&h<5)g='夜深了';else if(h>=5&&h<8)g='早安';else if(h>=8&&h<11)g='上午好';
  else if(h>=11&&h<13)g='午安';else if(h>=13&&h<17)g='下午好';
  else if(h>=17&&h<19)g='傍晚好';else if(h>=19&&h<23)g='晚上好';else g='夜深了';
  $('#greetText').textContent=g;
  initRain();
  setTimeout(()=>$('#splash').classList.add('hide'),2600);
  $('#splash').addEventListener('click',()=>$('#splash').classList.add('hide'));
}

function initRain(){
  const c=$('#rainCanvas'),ctx=c.getContext('2d');
  let w,h,drops=[];
  function resize(){w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;
    drops=Array.from({length:60},()=>({x:Math.random()*w,y:Math.random()*h,l:Math.random()*18+8,v:Math.random()*3+2,o:Math.random()*.3+.1}))}
  resize();
  let running=true;
  function draw(){
    if(!running)return;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(196,149,106,0.2)';ctx.lineWidth=1;
    drops.forEach(d=>{ctx.globalAlpha=d.o;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x,d.y+d.l);ctx.stroke();
      d.y+=d.v;if(d.y>h){d.y=-d.l;d.x=Math.random()*w}});
    requestAnimationFrame(draw)}
  draw();
  setTimeout(()=>{running=false},3500);
}

// ── Sessions ──
async function loadSessions(){
  try{const r=await api('/api/sessions');sessions=r.data||[];renderSessions();
    if(!currentSession&&sessions.length>0){currentSession=sessions[0].id;try{localStorage.setItem('lm_session',currentSession)}catch{}}
    if(currentSession)loadMessages()}catch(e){console.error('loadSessions',e)}}

function renderSessions(){
  const el=$('#sessionList');el.innerHTML='';
  sessions.forEach(s=>{
    const d=document.createElement('div');d.className='session-item'+(s.id===currentSession?' active':'');
    d.innerHTML=`<span class="s-name">${esc(s.name||'未命名')}</span>
      <span class="s-actions"><button class="s-rename" title="重命名">✎</button><button class="s-del" title="删除">✕</button></span>`;
    d.addEventListener('click',e=>{if(e.target.closest('.s-actions'))return;switchSession(s.id)});
    d.querySelector('.s-rename').addEventListener('click',()=>renameSession(s.id,s.name));
    d.querySelector('.s-del').addEventListener('click',()=>deleteSession(s.id));
    el.appendChild(d)})
}

async function switchSession(id){
  currentSession=id;try{localStorage.setItem('lm_session',id)}catch{}
  messages=[];allLoaded=false;renderSessions();closeSidebar();
  const s=sessions.find(x=>x.id===id);
  $('#headerTitle').textContent=s?.name||'林苗';
  await loadMessages()}

async function createSession(){
  const name=prompt('对话名称：');if(!name)return;
  try{const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({name})});
    if(r.data){sessions.unshift(r.data);switchSession(r.data.id)}}catch(e){toast('创建失败')}}

async function renameSession(id,oldName){
  const name=prompt('新名称：',oldName);if(!name||name===oldName)return;
  try{await api('/api/sessions/'+id,{method:'PATCH',body:JSON.stringify({name})});
    const s=sessions.find(x=>x.id===id);if(s)s.name=name;renderSessions();
    if(id===currentSession)$('#headerTitle').textContent=name}catch{toast('重命名失败')}}

async function deleteSession(id){
  if(!confirm('确定删除这个对话？'))return;
  try{await api('/api/sessions/'+id,{method:'DELETE'});
    sessions=sessions.filter(x=>x.id!==id);
    if(id===currentSession){currentSession=sessions[0]?.id||null;try{localStorage.setItem('lm_session',currentSession||'')}catch{}
      messages=[];allLoaded=false;if(currentSession)loadMessages();else renderMessages()}
    renderSessions()}catch{toast('删除失败')}}

// ── Messages ──
async function loadMessages(older=false){
  if(!currentSession)return;
  const offset=older?messages.length:0;
  const limit=30;
  try{const r=await api(`/api/sessions/${currentSession}/messages?limit=${limit}&offset=${offset}`);
    const data=(r.data||[]).filter(m=>m.visible!==false);
    if(!older){messages=data;renderMessages();scrollToBottom()}
    else{if(data.length<limit)allLoaded=true;messages=[...data,...messages];renderMessages()}
  }catch(e){console.error('loadMessages',e)}}

function renderMessages(){
  const el=$('#messages');
  el.innerHTML='';
  if(!allLoaded&&messages.length>=30){
    const ld=document.createElement('div');ld.className='load-more';
    ld.innerHTML='<button>加载更早消息</button>';
    ld.querySelector('button').addEventListener('click',()=>loadMessages(true));
    el.appendChild(ld)}

  let lastDate='',lastRole='';
  messages.forEach((m,i)=>{
    const d=fmtDate(m.created_at);
    if(d!==lastDate){lastDate=d;const sep=document.createElement('div');sep.className='date-sep';sep.innerHTML=`<span>${d}</span>`;el.appendChild(sep)}

    if(m.role==='assistant'&&m.metadata?.parts){
      m.metadata.parts.forEach((p,pi)=>{
        if(p.type==='narrator'){
          const nr=document.createElement('div');nr.className='msg-narrator';nr.textContent=p.text;el.appendChild(nr);lastRole='';
        }else if(p.type==='sticker'){
          const sk=document.createElement('div');sk.className='msg-sticker';
          sk.innerHTML=`<img src="/api/stickers?name=${encodeURIComponent(p.id)}" alt="sticker" onerror="this.style.display='none'">`;
          el.appendChild(sk);lastRole='';
        }else{
          const isFollow=lastRole==='assistant'&&pi>0;
          appendBubble(el,p.text||'',m.created_at,'in',isFollow,m.metadata?.thinking&&pi===0?m.metadata.thinking:null);
          lastRole='assistant'}})
    }else{
      const side=m.role==='user'?'out':'in';
      const isFollow=lastRole===m.role;
      if(m.role==='assistant'){
        appendBubble(el,m.content,m.created_at,side,isFollow,m.metadata?.thinking||null)
      }else{
        appendBubble(el,m.content,m.created_at,side,isFollow,null)}
      lastRole=m.role}
  });

  if(searchQuery)highlightSearch()}

function appendBubble(container,text,time,side,isFollow,thinking){
  const row=document.createElement('div');
  row.className=`msg-row ${side==='out'?'out':''}${isFollow?' followup':''}`;
  const avatarHtml=side==='out'?'<div class="avatar">我</div>':'<div class="avatar">苗</div>';
  const timeStr=fmtTime(time);
  let thinkHtml='';
  if(thinking){
    thinkHtml=`<div class="thinking-block"><div class="thinking-toggle" onclick="this.nextElementSibling.classList.toggle('open')">💭 思考过程</div><div class="thinking-content">${esc(thinking)}</div></div>`}
  row.innerHTML=`${avatarHtml}<div class="bubble"><div class="bubble-text">${formatText(text)}</div>${thinkHtml}<div class="time">${timeStr}</div></div>`;
  container.appendChild(row)}

function appendPendingBubble(text,id){
  const el=$('#messages');
  const row=document.createElement('div');row.className='msg-row out';row.id='pending-'+id;
  row.innerHTML=`<div class="avatar">我</div><div class="bubble"><div class="bubble-text">${formatText(text)}</div><div class="time">${fmtTime(new Date().toISOString())} <span class="status sending">发送中…</span></div></div>`;
  el.appendChild(row);scrollToBottom()}

function markPendingFailed(id){
  const row=$('#pending-'+id);if(!row)return;
  const st=row.querySelector('.status');if(st){st.className='status failed';st.textContent='发送失败，点击重试';
    st.addEventListener('click',()=>{row.remove();sendMessage(row._text)})}}

function removePending(id){const r=$('#pending-'+id);if(r)r.remove()}

function scrollToBottom(){
  const el=$('#messages');
  requestAnimationFrame(()=>el.scrollTop=el.scrollHeight)}

function isNearBottom(){
  const el=$('#messages');return el.scrollHeight-el.scrollTop-el.clientHeight<100}

// ── Send ──
let pendingId=0;
async function sendMessage(text){
  if(!text.trim()||!currentSession||sending)return;
  sending=true;
  const id=++pendingId;
  const trimmed=text.trim();
  appendPendingBubble(trimmed,id);
  $('#msgInput').value='';autoGrow($('#msgInput'));updateSendBtn();clearDraft();

  try{
    const r=await api('/api/chat',{method:'POST',body:JSON.stringify({sessionId:currentSession,message:trimmed})});
    removePending(id);
    if(r.parts){
      const now=new Date().toISOString();
      messages.push({role:'user',content:trimmed,created_at:now,visible:true});
      const assistantMsg={role:'assistant',content:r.parts.map(p=>p.text||'').join('\n\n'),created_at:now,visible:true,
        metadata:{parts:r.parts,thinking:r.thinking||null}};
      messages.push(assistantMsg);
      renderMessages();scrollToBottom()
    }else if(r.error){toast(r.error);markPendingFailed(id)}
  }catch(e){console.error('send',e);markPendingFailed(id);const row=$('#pending-'+id);if(row)row._text=trimmed}
  sending=false}

// ── Search ──
function highlightSearch(){
  if(!searchQuery)return;
  const q=searchQuery.toLowerCase();
  $$('.bubble-text').forEach(el=>{
    const txt=el.textContent;if(txt.toLowerCase().includes(q)){
      el.innerHTML=txt.replace(new RegExp(`(${escRegex(searchQuery)})`,'gi'),`<mark style="background:var(--accent);color:#1a1d21;border-radius:2px;padding:0 2px">$1</mark>`)}})}

function escRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

// ── Format ──
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function formatText(s){return esc(s).replace(/\n/g,'<br>')}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmtTime(iso){if(!iso)return'';const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

// ── Input ──
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function updateSendBtn(){$('#sendBtn').disabled=!$('#msgInput').value.trim();
  $('#sendBtn').classList.toggle('ready',!!$('#msgInput').value.trim())}
function saveDraft(){try{localStorage.setItem('lm_draft',JSON.stringify({s:currentSession,t:$('#msgInput').value}))}catch{}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem('lm_draft')||'{}');
  if(d.s===currentSession&&d.t){$('#msgInput').value=d.t;autoGrow($('#msgInput'));updateSendBtn()}}catch{}}
function clearDraft(){try{localStorage.removeItem('lm_draft')}catch{}}

// ── Sidebar ──
function openSidebar(){$('#sidebar').classList.add('open');$('#sidebarOverlay').classList.add('open')}
function closeSidebar(){$('#sidebar').classList.remove('open');$('#sidebarOverlay').classList.remove('open')}

// ── View switching ──
let currentView='chat';
function switchView(name){
  currentView=name;
  $$('.view').forEach(v=>v.classList.remove('active'));
  $(`#${name}View`).classList.add('active');
  $$('.nav-pill').forEach(p=>p.classList.toggle('active',p.dataset.view===name));
  if(name==='settings')loadSettingsUI();
  if(name==='space')loadPosts();
  $('#searchBtn').style.display=name==='chat'?'':'none';
  $('#navPills').hidden=false}

// ── Settings UI ──
function loadSettingsUI(){
  $('#adminPass').value=adminPass;
  $('#prefFontSize').value=prefs.fontSize;$('#prefFontSizeVal').textContent=prefs.fontSize+'px';
  $('#prefLineHeight').value=prefs.lineHeight;$('#prefLineHeightVal').textContent=prefs.lineHeight.toFixed(2);
  $('#prefGap').value=prefs.bubbleGap;$('#prefGapVal').textContent=prefs.bubbleGap+'px';
  $('#prefShowTime').classList.toggle('on',prefs.showTime);
  $('#prefEnterSend').classList.toggle('on',prefs.enterSend);
  loadRuntimeConfig();loadStickers()}

async function loadRuntimeConfig(){
  try{const r=await api('/api/runtime-config');
    $('#cfgModel').value=r.model||'';$('#cfgKey').value=r.apiKey?'••••••':'';$('#cfgUrl').value=r.baseUrl||''}catch{}}

async function saveRuntimeConfig(){
  const body={};
  const m=$('#cfgModel').value.trim();if(m)body.model=m;
  const k=$('#cfgKey').value.trim();if(k&&!k.startsWith('••'))body.apiKey=k;
  const u=$('#cfgUrl').value.trim();if(u)body.baseUrl=u;
  try{await api('/api/runtime-config',{method:'POST',body:JSON.stringify(body)});toast('配置已保存')}catch{toast('保存失败')}}

// ── Stickers ──
async function loadStickers(){
  try{const r=await api('/api/stickers');stickers=r.data||[];renderStickers()}catch{}}

function renderStickers(){
  const grid=$('#stickerGrid');grid.innerHTML='';
  stickers.forEach(s=>{
    const d=document.createElement('div');d.className='sticker-item';
    d.innerHTML=`<img src="${esc(s.url)}" alt="${esc(s.name)}"><button class="del">✕</button>`;
    d.querySelector('.del').addEventListener('click',async(e)=>{e.stopPropagation();
      try{await api('/api/stickers/'+s.id,{method:'DELETE'});loadStickers()}catch{toast('删除失败')}});
    grid.appendChild(d)})}

async function addSticker(){
  const name=$('#stickerName').value.trim(),url=$('#stickerUrl').value.trim();
  if(!name||!url)return toast('请填写名称和URL');
  try{await api('/api/stickers',{method:'POST',body:JSON.stringify({name,url})});
    $('#stickerName').value='';$('#stickerUrl').value='';loadStickers();toast('已添加')}catch{toast('添加失败')}}

// ── Space ──
let posts=[];
async function loadPosts(){
  try{const r=await api('/api/space/posts');posts=r.data||[];renderPosts()}catch{}}

function renderPosts(){
  const el=$('#postsList');el.innerHTML='';
  posts.forEach(p=>{
    const card=document.createElement('div');card.className='post-card';
    card.innerHTML=`<div class="post-text">${esc(p.content)}</div>
      ${p.image_url?`<img class="post-img" src="${esc(p.image_url)}">`:''}
      <div class="post-meta"><span>${fmtDate(p.created_at)} ${fmtTime(p.created_at)}</span>
        <button class="like-btn" data-id="${p.id}">♡ ${p.likes||0}</button>
        <button class="comment-toggle" data-id="${p.id}">💬 评论</button>
        <button class="del-post" data-id="${p.id}" style="margin-left:auto">删除</button></div>
      <div class="post-comments" id="comments-${p.id}" hidden></div>`;
    card.querySelector('.like-btn').addEventListener('click',()=>likePost(p));
    card.querySelector('.comment-toggle').addEventListener('click',()=>toggleComments(p.id));
    card.querySelector('.del-post').addEventListener('click',()=>delPost(p.id));
    el.appendChild(card)})}

async function createPost(){
  const text=$('#postInput').value.trim();if(!text)return;
  try{await api('/api/space/posts',{method:'POST',body:JSON.stringify({content:text})});
    $('#postInput').value='';loadPosts()}catch{toast('发布失败')}}

async function likePost(p){
  try{await api('/api/space/posts/'+p.id,{method:'PATCH',body:JSON.stringify({likes:(p.likes||0)+1})});loadPosts()}catch{}}

async function delPost(id){
  if(!confirm('删除这条？'))return;
  try{await api('/api/space/posts/'+id,{method:'DELETE'});loadPosts()}catch{toast('删除失败')}}

async function toggleComments(postId){
  const el=$('#comments-'+postId);
  if(!el.hidden){el.hidden=true;return}
  el.hidden=false;
  try{const r=await api(`/api/space/posts/${postId}/comments`);
    const comments=r.data||[];
    el.innerHTML=comments.map(c=>`<div class="comment"><b>${esc(c.author||'匿名')}</b>：${esc(c.content)}</div>`).join('')
      +`<div class="comment-input"><input type="text" placeholder="写评论…"><button>发送</button></div>`;
    const input=el.querySelector('input'),btn=el.querySelector('.comment-input button');
    btn.addEventListener('click',async()=>{const t=input.value.trim();if(!t)return;
      try{await api(`/api/space/posts/${postId}/comments`,{method:'POST',body:JSON.stringify({content:t,author:'小茼'})});
        toggleComments(postId);toggleComments(postId)}catch{toast('评论失败')}})}catch{el.innerHTML='<div class="comment" style="color:var(--text3)">加载失败</div>'}}

// ── Export/Import ──
async function exportData(){
  toast('正在导出…');
  try{
    const [sessR,stickR]=await Promise.all([api('/api/sessions'),api('/api/stickers')]);
    const allSessions=sessR.data||[];
    const sessionsWithMsgs=await Promise.all(allSessions.map(async s=>{
      const mr=await api(`/api/sessions/${s.id}/messages?limit=9999&offset=0`);
      return{...s,messages:mr.data||[]}}));
    const blob=new Blob([JSON.stringify({sessions:sessionsWithMsgs,stickers:stickR.data||[],exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`linmiao-backup-${fmtDate(new Date().toISOString())}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('导出完成')
  }catch(e){toast('导出失败：'+e.message)}}

function importData(){
  const file=$('#importFile').files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{const data=JSON.parse(e.target.result);
      toast(`导入 ${data.sessions?.length||0} 个对话…`);
      // TODO: full import via API (needs backend support for bulk import)
      toast('导入功能需要后端支持，暂不可用')}catch{toast('文件格式错误')}};
  reader.readAsText(file)}

// ── Events ──
function bindEvents(){
  $('#menuBtn').addEventListener('click',openSidebar);
  $('#sidebarOverlay').addEventListener('click',closeSidebar);
  $('#newSessionBtn').addEventListener('click',createSession);
  $('#navToggle').addEventListener('click',()=>{$('#navPills').hidden=!$('#navPills').hidden});

  $$('.nav-pill').forEach(p=>p.addEventListener('click',()=>switchView(p.dataset.view)));

  $('#searchBtn').addEventListener('click',()=>{$('#searchBar').classList.toggle('open');
    if($('#searchBar').classList.contains('open'))$('#searchInput').focus()});
  $('#closeSearch').addEventListener('click',()=>{$('#searchBar').classList.remove('open');$('#searchInput').value='';searchQuery='';renderMessages()});
  $('#searchInput').addEventListener('input',e=>{searchQuery=e.target.value;renderMessages()});

  const input=$('#msgInput');
  input.addEventListener('input',()=>{autoGrow(input);updateSendBtn();
    const len=input.value.length;$('#charCount').textContent=len>0?len+'字':'';saveDraft()});
  input.addEventListener('keydown',e=>{
    if(prefs.enterSend){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(input.value)}}
    else{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage(input.value)}}});
  $('#sendBtn').addEventListener('click',()=>sendMessage(input.value));

  // Settings
  $('#savePassBtn').addEventListener('click',()=>{adminPass=$('#adminPass').value;try{localStorage.setItem('lm_admin',adminPass)}catch{};toast('已保存')});
  $('#saveCfgBtn').addEventListener('click',saveRuntimeConfig);
  $('#prefFontSize').addEventListener('input',e=>{prefs.fontSize=+e.target.value;$('#prefFontSizeVal').textContent=prefs.fontSize+'px';savePrefs();applyPrefs()});
  $('#prefLineHeight').addEventListener('input',e=>{prefs.lineHeight=+e.target.value;$('#prefLineHeightVal').textContent=prefs.lineHeight.toFixed(2);savePrefs();applyPrefs()});
  $('#prefGap').addEventListener('input',e=>{prefs.bubbleGap=+e.target.value;$('#prefGapVal').textContent=prefs.bubbleGap+'px';savePrefs();applyPrefs()});
  $('#prefShowTime').addEventListener('click',function(){prefs.showTime=!prefs.showTime;this.classList.toggle('on',prefs.showTime);savePrefs();applyPrefs()});
  $('#prefEnterSend').addEventListener('click',function(){prefs.enterSend=!prefs.enterSend;this.classList.toggle('on',prefs.enterSend);savePrefs()});
  $('#addStickerBtn').addEventListener('click',addSticker);
  $('#postBtn').addEventListener('click',createPost);
  $('#exportBtn').addEventListener('click',exportData);
  $('#importFile').addEventListener('change',importData);

  // Touch swipe for sidebar
  let touchStartX=0;
  document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;
    if(touchStartX<30&&dx>60)openSidebar();
    if($('#sidebar').classList.contains('open')&&dx<-60)closeSidebar()},{passive:true});
}

// ── Init ──
function init(){
  loadPrefs();applyPrefs();bindEvents();initSplash();
  loadDraft();loadSessions();
  const s=sessions.find(x=>x.id===currentSession);
  if(s)$('#headerTitle').textContent=s.name||'林苗';
}

init();
})();
</script>
